<title>LED現調</title>
<style>
:root{--navy:#1F3864;--navy2:#2c4c86;--red:#c0392b;--green:#2e7d32;--amber:#b26a00;--bg:#f3f4f6;--card:#fff;--line:#d6d9de;--ink:#1d2129;--sub:#5b6270;--tap:52px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;min-height:56px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:16px;min-width:44px;min-height:44px;padding:0 6px}
main{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--navy)}
.row{display:flex;gap:8px;align-items:center}
.list a,.list button.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:inherit;text-decoration:none;min-height:var(--tap);font-size:16px}
.list .t{flex:1}.list .t b{display:block}.list .t small{color:var(--sub)}
.badge{font-size:12px;border-radius:99px;padding:2px 8px;white-space:nowrap;border:1px solid}
.b-none{color:#666;border-color:#bbb}.b-done{color:var(--green);border-color:var(--green)}.b-check{color:var(--amber);border-color:var(--amber)}.b-warn{color:var(--red);border-color:var(--red)}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
textarea{min-height:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:15px;min-height:44px;color:var(--ink)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:0 16px;min-height:var(--tap);font-size:17px;font-weight:600;background:var(--navy);color:#fff;width:100%}
.btn.sub{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.red{background:var(--red)}
.btn.sm{min-height:44px;font-size:15px;width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;gap:8px}.step button{width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:26px}
.step input{text-align:center;font-size:24px;font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.calc{background:#eef3fb;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:4}
.note{font-size:13px;color:var(--sub)}
.warn{background:#fdecea;color:#8a1c12;border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.ok{background:#e8f5e9;color:#1b5e20;border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.search-list{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.search-list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px;font-size:16px;min-height:48px}
/* カメラ */
#cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
#cam[hidden]{display:none}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(#000a,#0000);color:#fff}
#cam .top .chips button{background:#0006;color:#fff;border-color:#fff8}
#cam .top .chips button.on{background:#fff;color:#000}
#cam .bottom{display:flex;align-items:center;justify-content:space-between;padding:14px 22px calc(18px + env(safe-area-inset-bottom));background:#000}
#cam .shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#ffffff33}
#cam .shutter:active{background:#fff}
#cam .done{color:#fff;background:none;border:1.5px solid #fff;border-radius:12px;min-width:84px;min-height:48px;font-size:16px}
#cam .last{width:56px;height:56px;border-radius:8px;object-fit:cover;border:2px solid #fff;background:#222}
#cam .count{color:#fff;font-size:14px;margin-top:6px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .15s}
#viewer{position:fixed;inset:0;background:#000e;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#viewer[hidden]{display:none}
#viewer img{max-width:100%;max-height:75vh;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none;max-width:90vw}
</style>
</head>

/* ---------------- 保存（IndexedDB） ---------------- */
let DB;
function openDB(){
  return new Promise((ok, ng) => {
    const r = indexedDB.open("led_gencho", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore("main", {keyPath: "globalid"});
      d.createObjectStore("fixtures", {keyPath: "globalid"}).createIndex("parent", "parentglobalid");
      d.createObjectStore("reports", {keyPath: "globalid"}).createIndex("parent", "parentglobalid");
      d.createObjectStore("media", {keyPath: "id"}).createIndex("parent", "parent");
      d.createObjectStore("settings", {keyPath: "k"});
    };
    r.onsuccess = () => { DB = r.result; ok(); };
    r.onerror = () => ng(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((ok, ng) => {
    const t = DB.transaction(store, mode), s = t.objectStore(store);
    let res; const rq = fn(s);
    if (rq) rq.onsuccess = () => res = rq.result;
    t.oncomplete = () => ok(res); t.onerror = () => ng(t.error); t.onabort = () => ng(t.error);
  });
}
const put = (s, o) => tx(s, "readwrite", st => st.put(o));
const get = (s, k) => tx(s, "readonly", st => st.get(k));
const del = (s, k) => tx(s, "readwrite", st => st.delete(k));
const all = s => tx(s, "readonly", st => st.getAll());
const byParent = (s, p) => tx(s, "readonly", st => st.index("parent").getAll(p));
async function setting(k, v){ if (v === undefined) { const r = await get("settings", k); return r ? r.v : undefined; } await put("settings", {k, v}); }

function calcFixture(f, room){
  f.fx_qty = f.fx_method === "array" ? (num(f.fx_cols) || 0) * (num(f.fx_rows) || 0) : (num(f.fx_qty_in) || 0);
  const m = M.fixtures.find(x => x.name === f.fx_type) || {};
  f.fx_w_old = num(f.fx_w_field) > 0 ? num(f.fx_w_field) : num(m.watt);
  const r = M.rules[`${f.fx_type}|${f.fx_mount}`] || {};
  f.fx_led = r.led_code || ""; f.fx_w_led = num(r.led_watt);
  const h = annualHours(room);
  f.fx_kwh = (f.fx_w_old != null && f.fx_w_led != null && h) ? Math.round((f.fx_w_old - f.fx_w_led) * f.fx_qty * h / 100) / 10 : null;
  return f;
}
const annualHours = r => (num(r.hours_day) || 0) * (num(r.days_year) || 0);

function wire(root, o, onChange){
  root.querySelectorAll("[data-k]").forEach(el => el.addEventListener("input", () => { o[el.dataset.k] = el.value; onChange(el.dataset.k); }));
  root.querySelectorAll("[data-chips]").forEach(box => box.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const k = box.dataset.chips;
    if (box.dataset.multi) { b.classList.toggle("on"); o[k] = [...box.querySelectorAll("button.on")].map(x => x.dataset.v).join(" "); }
    else { box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); o[k] = b.dataset.v; }
    onChange(k);
  }));
  root.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.step, inp = root.querySelector(`input[data-k="${k}"]`);
    const v = Math.max(0, (num(inp.value) || 0) + (+b.dataset.d)); inp.value = v; o[k] = String(v); onChange(k);

}

/* ---------------- カメラ（連続撮影） ---------------- */
let STREAM = null;
async function openCamera(parent, questions, startQ){
  let q = startQ || questions[0][0], n = 0;
  const tags = $("#camtags");
  tags.innerHTML = questions.map(([c, l]) => `<button data-q="${c}" class="${c === q ? "on" : ""}">${esc(l)}</button>`).join("");
  tags.onclick = e => { const b = e.target.closest("button"); if (!b) return; q = b.dataset.q; tags.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
  const count = () => $("#camcount").textContent = `この画面で ${n} 枚撮影（撮るたびにスマホへ保存されます）`;
  count(); $("#camlast").removeAttribute("src");
  try {
    STREAM = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1440}}, audio: false});
  } catch (e) {
    // カメラ画面が使えない端末は、標準カメラ（ファイル選択）で代用
    return pickFiles(parent, q);
  }
  const v = $("#video"); v.srcObject = STREAM; await v.play().catch(() => {});
  $("#cam").hidden = false;
  $("#shutter").onclick = async () => {
    if (!v.videoWidth) return;
    const s = Math.min(1, 1920 / Math.max(v.videoWidth, v.videoHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(v.videoWidth * s); cv.height = Math.round(v.videoHeight * s);
    cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
    const f = $("#flash"); f.style.opacity = .8; setTimeout(() => f.style.opacity = 0, 120);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", .85));
    await put("media", {id: uuid(), parent, question: q, blob, mime: "image/jpeg", taken_at: now()});
    n++; count(); $("#camlast").src = URL.createObjectURL(blob);
    if (navigator.vibrate) navigator.vibrate(30);
  };
  $("#camdone").onclick = () => { closeCamera(); route(); };
}
function closeCamera(){ if (STREAM) STREAM.getTracks().forEach(t => t.stop()); STREAM = null; $("#cam").hidden = true; }
function pickFiles(parent, q){
  const fi = $("#filein"); fi.value = "";
  fi.onchange = async () => {
    for (const file of fi.files) {
      const blob = await shrink(file);
      await put("media", {id: uuid(), parent, question: q, blob, mime: "image/jpeg", taken_at: now()});
    }
    toast(`${fi.files.length}枚を保存しました`); route();
  };
  fi.click();
}
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
    const s = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, "image/jpeg", .85));
  } catch (e) { return file; }
}

function getGPS(o, after){
  if (!navigator.geolocation) return toast("位置情報が使えません");
  toast("位置を取得しています…");
  navigator.geolocation.getCurrentPosition(p => { o.lat = +p.coords.latitude.toFixed(7); o.lon = +p.coords.longitude.toFixed(7); o.gps_acc = Math.round(p.coords.accuracy); after(); toast(`位置を記録しました（誤差 約${o.gps_acc}m）`); },
    e => toast("位置を取得できませんでした（屋外か窓際で再度お試しください）"), {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
}
let REC = null;
async function toggleRecord(parent, btn){
  if (REC) { REC.stop(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio: true});
    const type = ["audio/mp4", "audio/webm", "audio/ogg"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    const chunks = []; REC = new MediaRecorder(st, type ? {mimeType: type} : undefined);
    REC.ondataavailable = e => chunks.push(e.data);
    REC.onstop = async () => {
      st.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type: REC.mimeType || "audio/mp4"}); REC = null;
      await put("media", {id: uuid(), parent, question: "rp_audio", blob, mime: blob.type, taken_at: now()});
      toast("音声を保存しました"); route();
    };
    REC.start(); btn.textContent = "■ 録音を止める"; btn.classList.add("red");
    setTimeout(() => REC && REC.state === "recording" && REC.stop(), 180000);
  } catch (e) { toast("マイクが使えません（設定で許可してください）"); }
}

/* ---------------- 書き出し（zip） ---------------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(files){ // files: [{name, data(Uint8Array)}]  無圧縮・UTF-8ファイル名
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)), dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate());
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true);
    h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true);
    c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + sz;
  }
  const csz = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csz, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type: "application/zip"});
}
const extOf = mime => mime.includes("jpeg") ? "jpg" : mime.includes("png") ? "png" : mime.includes("mp4") ? "m4a" : mime.includes("webm") ? "webm" : mime.includes("ogg") ? "ogg" : "bin";

async function viewExport(){
  setHeader("書き出し（バックアップ）", "#/");
  const mains = await all("main"), media = await all("media");
  const facs = [...new Set(mains.map(r => r.building))];
  app.innerHTML = `
  <div class="card"><h2>書き出す範囲</h2>
    <select id="scope"><option value="">すべての施設（${mains.length}件・写真等${media.length}点）</option>${facs.map(f => `<option value="${f}">${esc(facLabel(f))}</option>`).join("")}</select>
    <p class="note">書き出したzipを、パソコンのClaudeに「LED調査MCPでこのzipを取り込んで」と渡すと、台帳・写真帳・配置図を作れます。zipはスマホの中のデータを消しません。</p>
    <button class="btn" id="go">zipを作る</button><div id="out" style="margin-top:10px"></div></div>
  <div class="card"><h2>データの保護</h2><button class="btn sub" id="persist">データを消えにくくする（保存の保護を申請）</button>
    <p class="note">iPhoneはホーム画面に追加したアプリとして使ってください。ブラウザのまま使い、長期間開かないと、データが消えることがあります。</p></div>`;
  $("#persist").onclick = async () => { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; toast(ok ? "保存が保護されました" : "この端末では保護を申請できませんでした。こまめに書き出してください"); };
  $("#go").onclick = async () => {
    const scope = $("#scope").value; $("#out").innerHTML = "作成中…";
    const ms = mains.filter(r => !scope || r.building === scope), ids = new Set(ms.map(r => r.globalid));
    const fx = (await all("fixtures")).filter(f => ids.has(f.parentglobalid)), rp = (await all("reports")).filter(p => ids.has(p.parentglobalid));
    for (const f of fx) calcFixture(f, ms.find(r => r.globalid === f.parentglobalid));
    const all_ids = new Set([...ids, ...fx.map(f => f.globalid), ...rp.map(p => p.globalid)]);
    const md = media.filter(m => all_ids.has(m.parent)).sort((a, b) => (a.taken_at || "").localeCompare(b.taken_at || ""));
    const cnt = {}, files = [], mlist = [];
    for (const m of md) {
      const key = `${m.parent}_${m.question}`; cnt[key] = (cnt[key] || 0) + 1;
      const name = `media/${key}_${cnt[key]}.${extOf(m.mime || "")}`;
      files.push({name, data: new Uint8Array(await m.blob.arrayBuffer())}); mlist.push({parent: m.parent, question: m.question, file: name, taken_at: m.taken_at});
    }
    const data = {format: "led_gencho_app", version: APP_VERSION, exported_at: now(), reporter: await setting("reporter"), project: await setting("project"),
      main: ms.map(r => ({...r, annual_h: annualHours(r) || null, area_m2: num(r.depth_m) && num(r.width_m) ? +(r.depth_m * r.width_m).toFixed(1) : null})), fixtures: fx, reports: rp, media: mlist};
    files.unshift({name: "data.json", data: new TextEncoder().encode(JSON.stringify(data, null, 1))});
    const zip = await makeZip(files);
    const fname = `LED現調_${(await setting("project")) || "案件"}_${now().slice(0, 16).replace(/[-:T]/g, "")}.zip`;
    await setting("last_export", now());
    const file = new File([zip], fname, {type: "application/zip"});
    const url = URL.createObjectURL(zip);
    $("#out").innerHTML = `<div class="ok">${esc(fname)}（${(zip.size / 1048576).toFixed(1)}MB）を作りました。</div><a class="btn sub" href="${url}" download="${esc(fname)}">保存する</a>${navigator.canShare && navigator.canShare({files: [file]}) ? `<button class="btn" id="share" style="margin-top:8px">共有（AirDrop・メール等）</button>` : ""}`;
    const sh = $("#share"); if (sh) sh.onclick = () => navigator.share({files: [file], title: fname}).catch(() => {});
  };
}

/* ---------------- ルーター ---------------- */
async function route(){
  if (SAVE) { try { await SAVE(); } catch (e) {} SAVE = null; }
  app.innerHTML = ""; window.scrollTo(0, 0);
  const h = decodeURIComponent(location.hash || "#/").split("/");
  try {
    if (h[1] === "f" && h[3]) await viewFloor(h[2], h[3]);
    else if (h[1] === "f") await viewFacility(h[2]);
    else if (h[1] === "r") await viewRoom(h[2]);
    else if (h[1] === "x") await viewFixture(h[2]);
    else if (h[1] === "p") await viewReport(h[2]);
    else if (h[1] === "s") await viewSite(h[2]);
    else if (h[1] === "export") await viewExport();
    else await viewHome();
  } catch (e) { app.innerHTML = `<div class="warn">エラー：${esc(e.message || e)}</div>`; console.error(e); }
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (document.hidden && SAVE) SAVE(); });
$("#menu").onclick = () => location.hash = "#/export";
(async () => {
  await openDB();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) navigator.serviceWorker.register("sw.js").catch(() => {});
  route();
})();
</script>
